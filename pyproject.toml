[project]
name = "ros-developer-studio"
version = "0.0.1"
description = "Universal ROS 2 monitoring, diagnostics and bag analysis (scaffold)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "websockets>=12", "psutil>=5.9"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["backend*", "agent*"]
# rclpy and rosbag2_py come from the sourced ROS 2 install, not pip.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
